services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentcorp
      POSTGRES_PASSWORD: agentcorp
      POSTGRES_DB: agentcorp
    ports: ["5433:5432"]
    volumes: ["agentcorp-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcorp"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  agentcorp-pgdata:
