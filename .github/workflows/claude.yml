name: Claude

# Lets work happen on GitHub rather than on a laptop: mention @claude in an
# issue or PR comment, or assign an issue to Claude, and the task runs here.
#
# INERT until the ANTHROPIC_API_KEY secret is set. Note that this bills the
# Anthropic API, NOT Claude cloud-session credits -- cloud credits apply only
# to `claude --cloud` sessions started from an interactive terminal.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Skip unless someone actually asked for Claude, so ordinary comments do
    # not spend money.
    if: >-
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      github.event.action == 'assigned'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@main
        with:
          claude_args: |
            --allowedTools Read,Write,Edit,Bash,Grep,Glob
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
